name: 'Healthcare_360'
version: '1.0.0'
config-version: 2

profile: 'health360_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dabs"
  - "logs"

models:
  Healthcare_360:
    staging:
      +schema: STAGING
      +materialized: view
    dimensions:
      +schema: MARTS
      +materialized: table
    facts:
      +schema: INTERMEDIATE
      +materialized: table
    marts:
      +schema: MARTS
      +materialized: table
